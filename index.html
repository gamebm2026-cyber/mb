<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linux Desktop</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="desktop" id="desktop">
      <div class="desktop-icons" id="desktop-icons"></div>
      <div class="window-layer" id="window-layer"></div>
    </div>

    <header class="panel">
      <div class="panel-left">
        <div class="menu-wrap">
          <button class="panel-button app-menu-button" id="app-menu-button" aria-haspopup="true" aria-expanded="false">
            <span class="xfce-mark" aria-hidden="true"></span>
            Applications
          </button>
          <div class="app-menu" id="app-menu" role="menu" hidden></div>
        </div>
        <div class="panel-launchers" id="panel-launchers"></div>
      </div>
      <div class="panel-right">
        <span class="tray-item" title="Network">Online</span>
        <span class="tray-item" title="Volume">Vol 70%</span>
        <time class="clock" id="clock"></time>
      </div>
    </header>

    <footer class="taskbar">
      <div class="task-items" id="task-items"></div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
